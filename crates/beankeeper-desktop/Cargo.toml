[package]
name = "beankeeper-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false

[[bin]]
name = "bk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
age = "0.12.1"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.23.1"
beankeeper = { git = "https://github.com/Govcraft/beankeeper", branch = "main" }
beankeeper-cli = { git = "https://github.com/Govcraft/beankeeper", branch = "main" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
flate2 = "1.1.11"
getrandom = { version = "0.4.3", features = ["std"] }
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
keyring = "4.2.0"
mti = { version = "1.1.2", features = ["serde"] }
num-traits = "0.2.19"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rmcp = { version = "3.11.0", default-features = false, features = ["elicitation", "server", "transport-io"] }
rusty_paseto = { version = "0.10.1", default-features = false, features = ["v4_public"] }
schemars = "1.2.3"
secrecy = { version = "0.10.3", features = ["serde"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3.25.0", default-features = false }
sha2 = "0.11.1"
sigstore-verify = "0.17.0"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "macros"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
toml_edit = "0.25.19"
yaml_serde = "0.10.7"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
assert_cmd = "2.2.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json"] }
rusqlite = "0.39"
serde_json = "1.0.154"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
self-replace = "1.5.1"
windows-permissions = "0.2.4"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[build-dependencies]
toml_edit = { version = "0.25.19", default-features = false, features = ["parse"] }
