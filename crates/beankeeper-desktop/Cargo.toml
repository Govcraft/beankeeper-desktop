[package]
name = "beankeeper-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false

[[bin]]
name = "bk"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
beankeeper-cli = { git = "https://github.com/Govcraft/beankeeper", branch = "main", version = "0.26.1" }
clap = { version = "4.6.9", features = ["derive", "env"] }
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "time", "macros"] }

[dev-dependencies]
assert_cmd = "2.2.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
