<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Beankeeper</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/navigation.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header><a class="brand" href="/">Beankeeper<span>Desktop</span></a><span class="status">Local workspace</span></header>
  <div class="workspace">
    <nav aria-label="Workspace">
      <a href="/" data-view>Dashboard</a>
      <a href="/accounts" data-view>Accounts</a>
      <a href="/transactions" data-view>Transactions</a>
      <a href="/reports" data-view>Reports</a>
      <a href="/reconciliation" data-view>Reconciliation</a>
      <a href="/review" data-view>Review queue</a>
      <a href="/settings" data-view>License and updates</a>
    </nav>
    <main id="main" tabindex="-1">
      <p class="eyebrow">Your books, your agent</p>
      <h1>{{title}}</h1>
      <p class="intro">{{description}}</p>
      {{content}}
    </main>
  </div>
</body>
</html>
