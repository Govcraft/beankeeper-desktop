<section aria-labelledby="session">
  <h2 id="session">Paired browser</h2>
  <p data-agent-connection>{{connection}}</p>
  <form method="post" action="/api/session/pairing">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <button type="submit">Pair another browser</button>
  </form>
  <form method="post" action="/api/session/logout">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <button type="submit">Unpair this browser</button>
  </form>
</section>
