name: Published install guide

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/live-install.yml'
      - 'scripts/tests/skill-install-posix.py'
      - 'scripts/tests/skill-install-windows.ps1'

permissions:
  contents: read

jobs:
  published-install:
    name: Published install / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, also used by release.yml
      - name: Prepare the native credential store
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/tests/prepare-native-keychain.sh
      - name: Install from the guide on Linux and macOS
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: python -B scripts/tests/skill-install-posix.py --target "$TARGET" --published
      - name: Install from the guide with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tests/skill-install-windows.ps1 -Published
