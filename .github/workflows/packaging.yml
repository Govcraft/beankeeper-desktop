name: Packaging

# Builds, packages and exercises installers for the selected release targets.
# CI calls it with the targets a change affects; release.yml calls it with all
# of them for tags, manual dry runs and nightly qualification.
on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON {"include": [{"target": ..., "os": ...}]} from scripts/ci/plan.py'
        required: true
        type: string
      version:
        description: Workspace version validated by the caller
        required: true
        type: string
      sign:
        description: Allow optional Apple and Azure signing (tag releases only)
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    name: Package / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      # Signing stays off unless the caller is a tag release and accounts exist.
      ENABLE_APPLE_SIGNING: ${{ inputs.sign && vars.ENABLE_APPLE_SIGNING == 'true' }}
      ENABLE_AZURE_SIGNING: ${{ inputs.sign && vars.ENABLE_AZURE_SIGNING == 'true' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          family: release-${{ matrix.target }}
      - uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          official: ${{ inputs.sign && '1' || '0' }}
          license-public-keys-json: ${{ vars.BEANKEEPER_LICENSE_PUBLIC_KEYS_JSON }}
          license-service-url: ${{ vars.BEANKEEPER_LICENSE_SERVICE_URL }}
      - name: Check the Linux binary's glibc requirements
        if: runner.os == 'Linux'
        run: python scripts/release.py linux-abi --binary "target/$TARGET/release/bk"
      - name: Stage binary and documents
        run: |
          binary="target/$TARGET/release/bk"
          if [[ "$TARGET" == *windows* ]]; then binary="$binary.exe"; fi
          python scripts/release.py stage --target "$TARGET" --binary "$binary"
      - name: Detect optional Windows signing credentials
        if: runner.os == 'Windows'
        id: azure
        run: |
          enabled=false
          if [[ "$ENABLE_AZURE_SIGNING" == true && -n "$AZURE_TENANT_ID" && -n "$AZURE_CLIENT_ID" && -n "$AZURE_CLIENT_SECRET" && -n "$AZURE_SIGNING_ENDPOINT" && -n "$AZURE_SIGNING_ACCOUNT" && -n "$AZURE_CERTIFICATE_PROFILE" ]]; then
            enabled=true
          else
            echo 'Authenticode signing skipped: disabled or missing Azure credentials; account is pending. Keeping unsigned exe and installer.'
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Sign Windows binary (disabled by default)
        if: runner.os == 'Windows' && steps.azure.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}/staging/bk-${{ env.VERSION }}-${{ matrix.target }}
          files-folder-filter: exe
      - name: Smoke-test staged Desktop binary
        run: |
          binary="staging/bk-$VERSION-$TARGET/bk"
          if [[ "$TARGET" == *windows* ]]; then binary="$binary.exe"; fi
          reported=$("$binary" --version | tr -d '\r')
          test "$reported" = "bk $VERSION"
          "$binary" serve --help
          python scripts/check-license-embed.py "$binary"
      - name: Build OS installer
        run: python scripts/release.py installer --target "$TARGET"
      - name: Install the Linux package on Ubuntu 22.04 and Debian 12
        if: runner.os == 'Linux'
        run: |
          package="$GITHUB_WORKSPACE/dist/bk-$VERSION-$TARGET.deb"
          for image in ubuntu:22.04 debian:12-slim; do
            reported=$(docker run --rm --network none \
              --mount "type=bind,source=$package,target=/release.deb,readonly" \
              --env BK_NO_SERVICE=1 "$image" \
              sh -ec 'dpkg -i /release.deb >&2; exec bk --version')
            test "$reported" = "bk $VERSION"
          done
      - name: Optional Apple signing, notarization and stapling
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: scripts/sign-macos.sh "staging/bk-$VERSION-$TARGET" "$VERSION" "dist/bk-$VERSION-$TARGET.pkg"
      - name: Sign Windows installer (disabled by default)
        if: runner.os == 'Windows' && steps.azure.outputs.enabled == 'true'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
      - name: Archive final binary
        run: python scripts/release.py archive --target "$TARGET"
      - name: Bundle the native Claude Desktop extension
        run: python scripts/release.py mcpb --target "$TARGET"
      - name: Validate Linux package contents
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info "dist/bk-$VERSION-$TARGET.deb"
          dpkg-deb --contents "dist/bk-$VERSION-$TARGET.deb"
          mkdir unpacked
          dpkg-deb --extract "dist/bk-$VERSION-$TARGET.deb" unpacked
          reported=$(unpacked/usr/bin/bk --version | tr -d '\r')
          test "$reported" = "bk $VERSION"
          unpacked/usr/bin/bk serve --help
      - name: Inspect macOS installer payload
        if: runner.os == 'macOS'
        run: pkgutil --payload-files "dist/bk-$VERSION-$TARGET.pkg" | grep 'usr/local/bin/bk'
      - name: Test Windows EXE installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'bk-installer-test'
          $installer = Get-Item "dist/bk-$env:VERSION-$env:TARGET-setup.exe"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOSERVICE=1', "/DIR=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'EXE installer failed' }
          $reported = (& "$destination/bk.exe" --version).ToString().Trim()
          if ($LASTEXITCODE -ne 0 -or $reported -ne "bk $env:VERSION") { throw 'Installed binary failed' }
      - name: Test Windows checksum installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/install-windows.ps1
      - name: Prepare the native credential store
        if: runner.os != 'Windows'
        run: bash scripts/tests/prepare-native-keychain.sh
      - name: Exercise the packaged Claude extension and doctor
        run: |
          executable=bk
          if [[ "$RUNNER_OS" == Windows ]]; then executable=bk.exe; fi
          python scripts/tests/service-lifecycle.py "staging/bk-$VERSION-$TARGET/$executable" \
            --extension "dist/bk-$VERSION-$TARGET.mcpb"
      - name: Test the agent install guide on Linux and macOS
        if: runner.os != 'Windows'
        run: python scripts/tests/skill-install-posix.py --target "$TARGET"
      - name: Test the agent install guide on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/skill-install-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error


  collect:
    needs: build
    # A full matrix can produce a single download for both Mac architectures.
    runs-on: ${{ contains(inputs.matrix, 'aarch64-apple-darwin') && contains(inputs.matrix, 'x86_64-apple-darwin') && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bk-*
          path: dist
          merge-multiple: true
      - name: Bundle a universal Claude extension for macOS
        if: runner.os == 'macOS'
        run: python scripts/release.py mcpb-macos
      - name: Hash all final archives and installers
        run: python scripts/release.py checksums
      - name: Generate signed-update metadata
        run: python scripts/release.py update-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
