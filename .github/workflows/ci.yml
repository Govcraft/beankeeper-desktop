name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# New pushes supersede PR runs. Every main run keeps a unique group so merges
# landing back to back are each validated.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Small, reusable caches: no incremental state or debug info in CI builds.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  stable:
    name: Stable / format, clippy, tests and embedded UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
          fallback: none
      - run: cargo fmt --all -- --check
      - name: Check the documented installer contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_install.py'

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Compiling the test binaries also rebuilds the HTML/CSS embedded by
      # include_str!, directly from the checked-in UI sources.
      - name: Build embedded UI and test workspace
        run: cargo nextest run --workspace --locked
      - name: Documentation tests
        run: cargo test --workspace --locked --doc

  msrv:
    name: MSRV / Rust 1.91
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Overrides rust-toolchain.toml, which pins the newer CI compiler.
      RUSTUP_TOOLCHAIN: 1.91.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  service-lifecycle:
    name: Background service / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: service-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo build --locked
      - name: Prepare the native credential store
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/tests/prepare-native-keychain.sh
      - name: Exercise native lifecycle and crash recovery
        shell: bash
        run: |
          binary=target/debug/bk
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python scripts/tests/service-lifecycle.py "$binary"
