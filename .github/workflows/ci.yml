name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Stable / format, clippy, tests and embedded UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Check the documented installer contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_install.py'

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Compiling the test binaries also rebuilds the HTML/CSS embedded by
      # include_str!, directly from the checked-in UI sources.
      - name: Build embedded UI and test workspace
        run: cargo test --workspace --locked

  msrv:
    name: MSRV / Rust 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91
      - run: cargo check --workspace --all-targets --locked
