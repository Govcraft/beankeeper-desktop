name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Stable / format, clippy, tests and embedded UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Compiling the test binaries also rebuilds the HTML/CSS embedded by
      # include_str!, directly from the checked-in UI sources.
      - name: Build embedded UI and test workspace
        run: cargo test --workspace --locked

  msrv:
    name: MSRV / Rust 1.91
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91
      - run: cargo check --workspace --all-targets --locked

  service-lifecycle:
    name: Background service / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: service-${{ matrix.os }}
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: cargo build --locked
      - name: Prepare Linux user bus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uid=$(id -u)
          sudo systemctl start "user@$uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Exercise native lifecycle and crash recovery
        shell: bash
        run: |
          binary=target/debug/bk
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python scripts/tests/service-lifecycle.py "$binary"
