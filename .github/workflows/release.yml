name: Release

# Tags publish. Manual dispatch and the nightly schedule qualify main: they
# package every target unsigned and publish nothing. Pull requests package the
# targets their changes affect through ci.yml instead.
on:
  push:
    tags: ["beankeeper-desktop-v*"]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read
  # Nightly qualification checks earlier runs before repeating them.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      matrix: ${{ steps.plan.outputs.packaging }}
      needed: ${{ steps.qualified.outputs.needed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version against tag (dispatch uses workspace version)
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          if [[ "$IS_TAG" == true ]]; then
            version=$(python scripts/release.py version --tag "$RELEASE_TAG")
          else
            version=$(python scripts/release.py version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: python -B -m unittest discover -s scripts/tests -v
      - name: Select every release target
        id: plan
        run: python scripts/ci/plan.py --full
      - name: Skip a nightly run for an already qualified commit
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/evidence.py qualified

  packaging:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    uses: ./.github/workflows/packaging.yml
    with:
      matrix: ${{ needs.preflight.outputs.matrix }}
      version: ${{ needs.preflight.outputs.version }}
      # Always build unsigned on dry runs, even if accounts exist later.
      sign: ${{ github.event_name == 'push' }}
    secrets: inherit

  release:
    # Dispatch and scheduled runs build unsigned artifacts only. Never publishes.
    if: github.event_name == 'push'
    needs: [preflight, packaging]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      # Same D13 approach as Govcraft/beankeeper#108: bundle per final artifact,
      # including checksums, then attest precisely those bytes before upload.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign release artifacts with Sigstore
        working-directory: release
        run: |
          for artifact in *; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore" "$artifact"
          done
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.pkg
            release/*.zip
            release/*.exe
            release/*.mcpb
            release/checksums-sha256.txt
            release/update-manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Beankeeper Desktop v${{ needs.preflight.outputs.version }}
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.prerelease != 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
