[workspace]
members = ["crates/beankeeper-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.8"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/Govcraft/beankeeper-desktop"
license-file = "LICENSE.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
