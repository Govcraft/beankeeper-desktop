[workspace]
members = ["crates/beankeeper-desktop"]
resolver = "3"

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/Govcraft/beankeeper-desktop"
license-file = "LICENSE.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
